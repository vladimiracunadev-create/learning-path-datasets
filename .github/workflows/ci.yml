name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,qdrant]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
      - run: python scripts/smoke.py
      - run: python scripts/docs_stats.py --check
      - run: python scripts/verify_docs.py
      - run: python scripts/docs_diagram.py --check
      - run: lpdatasets validate
      - run: lpdatasets core-validate
      - run: lpdatasets clean-report --check
      - run: python -m pip wheel --no-deps -w dist .
