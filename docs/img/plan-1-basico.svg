<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1210" width="1200" height="1210" role="img" aria-labelledby="titulo descripcion" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="titulo">Qué se construye para 1.º básico</title>
<desc id="descripcion">La fuente alimenta un núcleo de contenido; cada modalidad lee de él a través de una selección por uso, público y marco. Base documentada (fase 0): hecha; Núcleo y limpieza (fase 1): hecha; Vigía y vacíos (fase 2): pendiente; RAG, MCP y agentes (fase 3): pendiente; Dataset y ajuste (fase 4): pendiente.</desc>
