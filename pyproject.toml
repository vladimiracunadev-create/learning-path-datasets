[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "learning-path-datasets"
version = "0.2.0"
description = "Datasets multiconocimiento en JSONL y base vectorial, construidos desde programas de aprendizaje con procedencia, licencia y particiones verificables."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Acuña"}]
keywords = ["datasets", "jsonl", "vector-database", "rag", "education", "chile", "spanish", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
qdrant = [
  "qdrant-client>=1.9,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "jsonschema>=4.22,<5",
]
audit = [
  "pip-audit>=2.7,<3",
]

[project.scripts]
lpdatasets = "lpdatasets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lpdatasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]
